<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Type"
      content="text/html; charset=utf-8"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>
      Unity WebGL Player | Bus Shelter RIGA S-Size
    </title>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 600px;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <canvas id="unity-canvas"></canvas>

    <script src="Build/riga-bus-stop-S.loader.js"></script>

    <script>
      (function () {
        "use strict";

        // --- Логика автоопределения оптимального DPR ---
        function getOptimalDevicePixelRatio() {
          const rawDPR = window.devicePixelRatio || 1;
          
          if (rawDPR <= 1) return 1;

          const isMobileOrTablet = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) 
            || (navigator.maxTouchPoints && navigator.maxTouchPoints > 2);

          if (isMobileOrTablet) {
            let isWeakGPU = false;
            try {
              const gl = document.createElement('canvas').getContext('webgl');
              if (gl) {
                const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                const renderer = debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : '';
                if (/Mali-4|Mali-G3|Mali-G5|Adreno 3|Adreno 4|Adreno 50/i.test(renderer)) {
                  isWeakGPU = true;
                }
              }
            } catch (e) {
              console.warn("Could not detect GPU", e);
            }

            if (isWeakGPU) {
              return 1;
            }

            return Math.min(rawDPR, 1.5);
          }

          return Math.min(rawDPR, 2.0);
        }

        const optimalDPR = getOptimalDevicePixelRatio();
        const canvas = document.querySelector("#unity-canvas");

        // --- Принудительное обновление атрибутов width/height с учетом DPR ---
        function updateCanvasDimensions() {
          const rect = canvas.getBoundingClientRect();
          const displayWidth = Math.round(rect.width * optimalDPR);
          const displayHeight = Math.round(rect.height * optimalDPR);

          if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
            canvas.width = displayWidth;
            canvas.height = displayHeight;
          }
        }

        // Задаем корректное разрешение холста до инициализации Unity
        updateCanvasDimensions();
        window.addEventListener('resize', updateCanvasDimensions);

        const UNITY_TARGET_OBJECT = "3 Glass short";

        const METHOD_BY_TYPE = {
          RearDisplay: "RearDisplayFromJs",
          SideDisplay: "SideDisplayFromJs",
          SideGlass: "SideGlassFromJs",
          PosterFrame: "PosterFrameFromJs",
          Silluete: "SillueteFromJs"
        };

        const queuedMessages = [];

        let unityInstance;

        function sendToUnity(type, message) {
          const method = METHOD_BY_TYPE[type];

          if (!method || !unityInstance) {
            return;
          }

          try {
            unityInstance.SendMessage(
              UNITY_TARGET_OBJECT,
              method,
              String(message)
            );
          } catch (error) {
            console.error(
              "Could not send " + type + " to Unity:",
              error
            );
          }
        }

        window.addEventListener(
          "message",
          function (event) {
            if (
              event.source !== window.parent ||
              !event.data ||
              !METHOD_BY_TYPE[event.data.type]
            ) {
              return;
            }

            const message = {
              type: event.data.type,
              message: event.data.message
            };

            if (!unityInstance) {
              queuedMessages.push(message);
            } else {
              sendToUnity(
                message.type,
                message.message
              );
            }
          }
        );

        createUnityInstance(canvas, {
          dataUrl: "Build/riga-bus-stop-S.data",
          frameworkUrl: "Build/riga-bus-stop-S.framework.js",
          codeUrl: "Build/riga-bus-stop-S.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Bus Shelter RIGA S-Size",
          productVersion: "1.0",
          matchWebGLToCanvasSize: false, // Запрещаем Unity перезаписывать ширину/высоту Canvas
          devicePixelRatio: optimalDPR,
          webglContextAttributes: {
            antialias: true,
            powerPreference: "high-performance"
          }
        })
          .then(function (instance) {
            unityInstance = instance;
            window.unityInstance = instance;

            // Дополнительная проверка корректности размеров после загрузки
            updateCanvasDimensions();

            while (
              queuedMessages.length > 0
            ) {
              const queued =
                queuedMessages.shift();

              sendToUnity(
                queued.type,
                queued.message
              );
            }

            window.parent.postMessage(
              {
                type: "UNITY_READY"
              },
              "*"
            );
          })
          .catch(function (error) {
            console.error(
              "Unity failed to load:",
              error
            );
          });
      }());
    </script>
  </body>
</html>
